    function enviarTageoPromocion(evento, nombre, posicion) {
        if (!window.digitalData || typeof window.digitalData.push !== 'function') {
            window.digitalData = [];
        }

        window.digitalData.push({
            promotion: {
                name: nombre,
                creative: 'Button',
                position: posicion
            },
            event: evento
        });
    }

    function registrarVistaPromocion(elemento, nombre, posicion) {
        const clave = nombre + '|' + posicion;
        if (!elemento || promocionesVistas.has(clave) || promocionesObservadas.has(clave)) {
            return;
        }

        promocionesObservadas.add(clave);
        const enviarVista = () => {
            if (promocionesVistas.has(clave)) {
                return;
            }
            promocionesVistas.add(clave);
            promocionesObservadas.delete(clave);
            enviarTageoPromocion('trackPromotionView', nombre, posicion);
        };

        if (!('IntersectionObserver' in window)) {
            enviarVista();
            return;
        }

        const observer = new IntersectionObserver((entradas) => {
            if (entradas.some((entrada) => entrada.isIntersecting && entrada.intersectionRatio >= 0.5)) {
                observer.disconnect();
                enviarVista();
            }
        }, { threshold: [0.5] });
        observer.observe(elemento);
    }

    function crearBloqueConoceMas() {
        const contenedor = document.createElement('a');
        contenedor.className = 'bcp_conoce_mas';
        contenedor.href = contenidoPagina.conoceMas.url;
        contenedor.style.display = 'inline-flex';
        contenedor.style.alignItems = 'center';
        contenedor.style.gap = '8px';
        contenedor.style.marginBottom = '32px';
        contenedor.style.color = colorConoceMas;
        contenedor.style.fontWeight = '600';
        contenedor.style.textDecoration = 'none';
        contenedor.style.cursor = 'pointer';

        const texto = document.createElement('span');
        texto.textContent = contenidoPagina.conoceMas.texto;
        texto.style.fontSize = '16px';
        texto.style.lineHeight = '24px';

        const icono = document.createElement('img');
        icono.src = 'data:image/svg+xml;base64,' + iconoConoceMasBase64;
        icono.alt = '';
        icono.width = 18;
        icono.height = 18;

        contenedor.appendChild(texto);
        contenedor.appendChild(icono);
        return contenedor;
    }

    function aplicarBotonHeader() {
        const opcionesHeader = document.querySelector('.header_sin_acceso .bcp_opciones');
        if (!opcionesHeader) {
            return false;
        }

        if (opcionesHeader.querySelector('.bcp_boton_adquirir_header')) {
            return true;
        }

        const botonHeader = document.createElement('a');
        botonHeader.className = 'bcp_boton_adquirir_header';
        botonHeader.href = contenidoPagina.header.urlBoton;
        botonHeader.textContent = contenidoPagina.header.textoBoton;
        botonHeader.setAttribute('data-translate', 'true');
        opcionesHeader.appendChild(botonHeader);
        return true;
    }

    if (!aplicarBotonHeader()) {
        const observerHeader = new MutationObserver(() => {
            if (aplicarBotonHeader()) {
                observerHeader.disconnect();
            }
        });
        observerHeader.observe(document.body, { childList: true, subtree: true });
    }

    function inyectarImagenesFormulario() {
        const imagenes = contenidoPagina.formulario.imagenes;
        const formulario = document.querySelector('.bcp_formulario_latam_cards .form_promocion');

        if (!formulario) {
            return;
        }

        formulario.classList.remove('lazy_loading');

        if (formulario.querySelector('.bcp_imagen_formulario')) {
            return;
        }

        const picture = document.createElement('picture');
        picture.className = 'bcp_imagen_formulario';
        picture.setAttribute('aria-hidden', 'true');

        const sourceMobile = document.createElement('source');
        sourceMobile.media = '(max-width: 767px)';
        sourceMobile.srcset = imagenes.mobile;

        const imagen = document.createElement('img');
        imagen.src = imagenes.desktop;
        imagen.alt = '';
        imagen.decoding = 'async';
        imagen.setAttribute('fetchpriority', 'high');

        picture.appendChild(sourceMobile);
        picture.appendChild(imagen);
        formulario.insertBefore(picture, formulario.firstChild);
    }
    inyectarImagenesFormulario();

    function deshabilitarCtasRegistro() {
        registroCompletado = true;
        const selectores = [
            '#formulario-latam-pass ' + BOTON_SELECTOR,
            '.bcp_boton_inscribirse_millas',
            '.bcp_banner_seguro_tarjetas_latam_piloto .bcp_boton_ancla_formulario',
            'a[href="#formulario-latam-pass"]'
        ];

        document.querySelectorAll(selectores.join(',')).forEach((cta) => {
            const esBoton = cta.tagName === 'BUTTON';
            const texto = cta.querySelector('span');

            if (esBoton) {
                cta.disabled = true;
            } else {
                cta.tabIndex = -1;
                cta.style.pointerEvents = 'none';
            }

            cta.setAttribute('aria-disabled', 'true');
            cta.setAttribute('data-registro-completado', 'true');
            cta.style.cursor = 'default';
            cta.style.opacity = '0.45';

            if (texto) {
                texto.textContent = contenidoPagina.formulario.textoRegistroCompletado;
            } else {
                cta.textContent = contenidoPagina.formulario.textoRegistroCompletado;
            }
        });
    }

    function crearDescripcionSolicitudExito(contenidoExito) {
        const descripcion = document.createElement('p');
        descripcion.className = 'bcp_exito_solicitud_descripcion';
        const indiceDestacado = contenidoExito.descripcionSolicitud.indexOf(
            contenidoExito.textoDestacado);

        if (indiceDestacado === -1) {
            descripcion.textContent = contenidoExito.descripcionSolicitud;
            return descripcion;
        }

        descripcion.appendChild(document.createTextNode(
            contenidoExito.descripcionSolicitud.slice(0, indiceDestacado)));
        const destacado = document.createElement('strong');
        destacado.textContent = contenidoExito.textoDestacado;
        descripcion.appendChild(destacado);
        descripcion.appendChild(document.createTextNode(
            contenidoExito.descripcionSolicitud.slice(
                indiceDestacado + contenidoExito.textoDestacado.length)));
        return descripcion;
    }

        columna.style.backgroundColor = colorFondoTarjeta;
        columna.style.borderRadius = '16px';
        columna.style.padding = '16px 32px 24px 32px';
        columna.style.textAlign = 'left';
        columna.style.boxSizing = 'border-box';
        columna.style.scrollSnapAlign = 'center';
        columna.style.scrollSnapStop = 'always';

        const img = document.createElement('img');
        img.src = tarjeta.img;
        // El nombre visible inmediatamente debajo ya identifica la tarjeta.
        img.alt = '';
        img.draggable = false;
        img.width = 92;
        img.height = 59;
        img.style.display = 'block';
        img.style.margin = '0 auto 16px auto';
        img.style.borderRadius = '4px';
        img.style.boxShadow =
            '0 4px 6px rgba(32, 46, 68, 0.12), 0 8px 16px rgba(32, 46, 68, 0.16)';

        const nombre = document.createElement('div');
        nombre.className = 'bcp_tarjeta_millas_nombre';
        nombre.textContent = tarjeta.nombre;
        nombre.style.color = colorBeneficiosTitulo;
        nombre.style.fontFamily = 'Flexo-Demi';
        nombre.style.fontSize = '16px';
        nombre.style.lineHeight = '24px';
        nombre.style.textAlign = 'center';
        nombre.style.marginBottom = '4px';

        const meta = document.createElement('div');
        meta.textContent = contenidoPagina.millas.prefijoMeta + tarjeta.meta;
        meta.style.color = colorMetaConsumo;
        meta.style.fontSize = '14px';
        meta.style.lineHeight = '22px';
        meta.style.textAlign = 'center';
        meta.style.marginBottom = '16px';

        columna.appendChild(img);
        columna.appendChild(nombre);
        columna.appendChild(meta);
        columna.appendChild(crearFilaBono(contenidoPagina.millas.etiquetas.digital,
            tarjeta.digital, false));
        columna.appendChild(crearDivisorTarjeta());
        columna.appendChild(crearFilaBono(contenidoPagina.millas.etiquetas.regular,
            tarjeta.regular, false));
        columna.appendChild(crearDivisorTarjeta());
        columna.appendChild(crearFilaBono(contenidoPagina.millas.etiquetas.adicional,
            tarjeta.adicional, false));
        columna.appendChild(crearDivisorTarjeta());
        columna.appendChild(crearFilaBono(contenidoPagina.millas.etiquetas.total,
            tarjeta.total, true));

        return columna;
    }

    function crearSeccionMillas() {
        const idTituloMillas = 'bcp-titulo-seccion-millas';
        const idPanelMillas = 'bcp-panel-tarjetas-millas';
        const idCarruselMillas = 'bcp-carrusel-tarjetas-millas';
        const seccion = document.createElement('div');
        seccion.className = 'bcp_seccion_millas container';
        seccion.style.textAlign = 'center';

        const titulo = document.createElement('h2');
        titulo.id = idTituloMillas;
        titulo.className = 'bcp_seccion_beneficios_titulo';
        titulo.textContent = contenidoPagina.millas.titulo;
        titulo.style.color = colorBeneficiosTitulo;
        titulo.style.fontFamily = 'Flexo-Demi';
        titulo.style.marginBottom = '32px';

        const filaTabs = document.createElement('div');
        filaTabs.setAttribute('role', 'tablist');
        filaTabs.setAttribute('aria-label', 'Marca de tarjeta');
        filaTabs.style.display = 'inline-flex';
        filaTabs.style.marginBottom = '32px';

        const panelTarjetas = document.createElement('div');
        panelTarjetas.id = idPanelMillas;
        panelTarjetas.className = 'bcp_panel_millas';
        panelTarjetas.setAttribute('role', 'tabpanel');
        panelTarjetas.tabIndex = 0;

        const carruselTarjetas = document.createElement('div');
        carruselTarjetas.setAttribute('role', 'region');
        carruselTarjetas.setAttribute('aria-roledescription', 'carrusel');
        carruselTarjetas.setAttribute('aria-labelledby', idTituloMillas);
        carruselTarjetas.style.position = 'relative';
        carruselTarjetas.style.marginBottom = '32px';

        const contenedorTarjetas = document.createElement('div');
        contenedorTarjetas.id = idCarruselMillas;
        contenedorTarjetas.className = 'bcp_contenedor_tarjetas_millas';
        contenedorTarjetas.setAttribute('aria-atomic', 'false');
        contenedorTarjetas.style.display = 'flex';
        contenedorTarjetas.style.flexWrap = 'nowrap';
        contenedorTarjetas.style.justifyContent = 'flex-start';
        contenedorTarjetas.style.gap = gapTarjetasMillas + 'px';
        contenedorTarjetas.style.overflowX = 'auto';
        contenedorTarjetas.style.overflowY = 'hidden';
        contenedorTarjetas.style.paddingBottom = '24px';
        contenedorTarjetas.style.scrollBehavior = 'smooth';
        contenedorTarjetas.style.scrollSnapType = 'x mandatory';
        contenedorTarjetas.style.overscrollBehaviorX = 'contain';
        contenedorTarjetas.style.WebkitOverflowScrolling = 'touch';
        contenedorTarjetas.style.boxSizing = 'border-box';
        contenedorTarjetas.style.width = '100%';

        function crearFlechaCarrusel(direccion) {
            const flecha = document.createElement('button');
            const esAnterior = direccion === -1;
            flecha.className = 'bcp_flecha_millas';
            flecha.type = 'button';
            flecha.setAttribute('aria-label', esAnterior ? 'Ver tarjetas anteriores' : 'Ver tarjetas siguientes');
            flecha.setAttribute('aria-controls', idCarruselMillas);
            flecha.style.display = 'none';
            flecha.style.alignItems = 'center';
            flecha.style.justifyContent = 'center';
            flecha.style.position = 'absolute';
            flecha.style.top = '50%';
            flecha.style[esAnterior ? 'left' : 'right'] = '-16px';
            flecha.style.transform = 'translateY(-50%)';
            flecha.style.zIndex = '2';
            flecha.style.padding = '0';
            flecha.style.border = '0';
            flecha.style.borderRadius = '50%';
            flecha.style.backgroundColor = colorConoceMas;
            flecha.style.color = '#FFFFFF';
            flecha.style.fontFamily = 'Arial, sans-serif';
            flecha.style.fontWeight = '400';
            flecha.style.lineHeight = '1';
            flecha.style.cursor = 'pointer';
            flecha.style.boxShadow = 'none';
            flecha.style.transition = 'opacity 160ms ease';

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '15');
            svg.setAttribute('height', '10');
            svg.setAttribute('viewBox', '0 0 15 10');
            svg.setAttribute('fill', 'none');
            svg.setAttribute('aria-hidden', 'true');
            svg.style.display = 'block';
            if (esAnterior) {
                svg.style.transform = 'rotate(180deg)';
            }

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', 'M1 5H14M10 1L14 5L10 9');
            path.setAttribute('stroke', '#FFFFFF');
            path.setAttribute('stroke-width', '1.6');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');

            svg.appendChild(path);
            flecha.appendChild(svg);
            return flecha;
        }

        const flechaAnterior = crearFlechaCarrusel(-1);
        const flechaSiguiente = crearFlechaCarrusel(1);
        const estadoCarrusel = document.createElement('div');
        estadoCarrusel.className = 'bcp_solo_lectores';
        estadoCarrusel.setAttribute('aria-live', 'polite');
        estadoCarrusel.setAttribute('aria-atomic', 'true');
        let indiceTarjetaActiva = 0;
        let ultimoMensajeAnunciado = '';

        function obtenerCantidadTarjetasVisibles() {
            const primeraTarjeta = contenedorTarjetas.firstElementChild;
            if (!primeraTarjeta) {
                return 0;
            }

            const anchoTarjeta = primeraTarjeta.getBoundingClientRect().width;
            const capacidad = (contenedorTarjetas.clientWidth + gapTarjetasMillas) /
                (anchoTarjeta + gapTarjetasMillas);
            return Math.max(1, Math.floor(capacidad + 0.001));
        }

        function hayDesbordeTarjetas() {
            return contenedorTarjetas.children.length > obtenerCantidadTarjetasVisibles();
        }

        function actualizarEstadoBotonesCarrusel() {
            const cantidadTarjetas = contenedorTarjetas.children.length;
            const cantidadVisible = Math.min(cantidadTarjetas, obtenerCantidadTarjetasVisibles());
            const ultimoIndice = Math.max(0, cantidadTarjetas - cantidadVisible);
            const hayDesborde = cantidadTarjetas > cantidadVisible;

            const aplicarEstado = (boton, deshabilitado) => {
                boton.disabled = deshabilitado;
                boton.setAttribute('aria-disabled', deshabilitado ? 'true' : 'false');
                boton.style.opacity = deshabilitado ? '0.45' : '1';
                boton.style.cursor = deshabilitado ? 'default' : 'pointer';
            };

            aplicarEstado(flechaAnterior, !hayDesborde || indiceTarjetaActiva <= 0);
            aplicarEstado(flechaSiguiente, !hayDesborde || indiceTarjetaActiva >= ultimoIndice);
        }

        function centrarTarjetaActiva(animar) {
            const tarjeta = contenedorTarjetas.children[indiceTarjetaActiva];
            if (!tarjeta) {
                return;
            }

            const cantidadVisible = obtenerCantidadTarjetasVisibles();
            const destino = cantidadVisible === 1 ?
                tarjeta.offsetLeft - ((contenedorTarjetas.clientWidth - tarjeta.offsetWidth) / 2) :
                tarjeta.offsetLeft;
            const reducirMovimiento = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const destinoSeguro = Math.max(0, destino);
            if (Math.abs(contenedorTarjetas.scrollLeft - destinoSeguro) < 1) {
                return;
            }
            contenedorTarjetas.scrollTo({
                left: destinoSeguro,
                behavior: animar && !reducirMovimiento ? 'smooth' : 'auto'
            });
        }

        function actualizarIndiceTarjetaActiva() {
            const cantidadVisible = obtenerCantidadTarjetasVisibles();
            const referenciaVisible = cantidadVisible === 1 ?
                contenedorTarjetas.scrollLeft + (contenedorTarjetas.clientWidth / 2) :
                contenedorTarjetas.scrollLeft;
            let distanciaMenor = Infinity;

            Array.from(contenedorTarjetas.children).forEach((tarjeta, indice) => {
                const referenciaTarjeta = cantidadVisible === 1 ?
                    tarjeta.offsetLeft + (tarjeta.offsetWidth / 2) :
                    tarjeta.offsetLeft;
                const distancia = Math.abs(referenciaTarjeta - referenciaVisible);
                if (distancia < distanciaMenor) {
                    distanciaMenor = distancia;
                    indiceTarjetaActiva = indice;
                }
            });

            indiceTarjetaActiva = Math.min(indiceTarjetaActiva,
                Math.max(0, contenedorTarjetas.children.length - cantidadVisible));
        }

        function actualizarAccesibilidadCarrusel(anunciar) {
            const cantidadTarjetas = contenedorTarjetas.children.length;
            const cantidadVisible = Math.min(cantidadTarjetas, obtenerCantidadTarjetasVisibles());
            const primerIndiceVisible = Math.min(indiceTarjetaActiva,
                Math.max(0, cantidadTarjetas - cantidadVisible));
            const ultimoIndiceVisible = Math.min(cantidadTarjetas,
                primerIndiceVisible + cantidadVisible);

            Array.from(contenedorTarjetas.children).forEach((tarjeta, indice) => {
                const esVisible = indice >= primerIndiceVisible && indice < ultimoIndiceVisible;
                tarjeta.setAttribute('aria-hidden', esVisible ? 'false' : 'true');
            });

            let mensaje;
            if (cantidadTarjetas === cantidadVisible) {
                mensaje = 'Mostrando las ' + cantidadTarjetas + ' tarjetas disponibles.';
            } else {
                mensaje = 'Mostrando tarjetas ' + (primerIndiceVisible + 1) + ' a ' +
                    ultimoIndiceVisible + ' de ' + cantidadTarjetas + '.';
            }

            if (anunciar && mensaje !== ultimoMensajeAnunciado) {
                ultimoMensajeAnunciado = mensaje;
                estadoCarrusel.textContent = '';
                requestAnimationFrame(() => {
                    estadoCarrusel.textContent = mensaje;
                });
            } else {
                estadoCarrusel.textContent = mensaje;
                ultimoMensajeAnunciado = mensaje;
            }
            actualizarEstadoBotonesCarrusel();
        }

        function actualizarFlechasCarrusel() {
            contenedorTarjetas.style.paddingLeft = '0';
            contenedorTarjetas.style.paddingRight = '0';
            Array.from(contenedorTarjetas.children).forEach((tarjeta) => {
                tarjeta.style.removeProperty('flex');
                tarjeta.style.removeProperty('width');
                tarjeta.style.removeProperty('max-width');
            });

            const cantidadTarjetas = contenedorTarjetas.children.length;
            const cantidadVisible = Math.min(cantidadTarjetas, obtenerCantidadTarjetasVisibles());

            // El ancho base define cuántos cards caben. Luego se reparte todo el ancho
            // disponible entre esa cantidad, conservando siempre los gaps de 24px.
            if (cantidadVisible > 0) {
                const anchoDisponibleCards = contenedorTarjetas.clientWidth -
                    (gapTarjetasMillas * (cantidadVisible - 1));
                const anchoCalculado = anchoDisponibleCards / cantidadVisible;
                const esDesktop = window.matchMedia ?
                    window.matchMedia('(min-width: 1280px)').matches : window.innerWidth >= 1280;
                const limitarAnchoDosTarjetas = cantidadTarjetas === 2 && esDesktop;
                const anchoTarjeta = limitarAnchoDosTarjetas ?
                    Math.min(anchoCalculado, 320) : anchoCalculado;
                Array.from(contenedorTarjetas.children).forEach((tarjeta) => {
                    tarjeta.style.flex = '0 0 ' + anchoTarjeta + 'px';
                    tarjeta.style.width = anchoTarjeta + 'px';
                    if (limitarAnchoDosTarjetas) {
                        tarjeta.style.maxWidth = '320px';
                    }
                });
            }

            const hayDesborde = cantidadTarjetas > cantidadVisible;
            const display = hayDesborde ? 'flex' : 'none';
            flechaAnterior.style.display = display;
            flechaSiguiente.style.display = display;
            panelTarjetas.tabIndex = hayDesborde ? -1 : 0;
            contenedorTarjetas.style.cursor = hayDesborde ? 'grab' : 'default';
            contenedorTarjetas.style.justifyContent = hayDesborde ? 'flex-start' : 'center';

            Array.from(contenedorTarjetas.children).forEach((tarjeta) => {
                tarjeta.style.scrollSnapAlign = cantidadVisible === 1 ? 'center' : 'start';
            });

            if (hayDesborde && cantidadVisible === 1) {
                const primeraTarjeta = contenedorTarjetas.firstElementChild;
                const espacioLateral = Math.max(0,
                    (contenedorTarjetas.clientWidth - primeraTarjeta.offsetWidth) / 2);
                contenedorTarjetas.style.paddingLeft = espacioLateral + 'px';
                contenedorTarjetas.style.paddingRight = espacioLateral + 'px';
                requestAnimationFrame(() => centrarTarjetaActiva(false));
            } else if (hayDesborde) {
                indiceTarjetaActiva = Math.min(indiceTarjetaActiva,
                    contenedorTarjetas.children.length - cantidadVisible);
                requestAnimationFrame(() => centrarTarjetaActiva(false));
            } else {
                indiceTarjetaActiva = 0;
                contenedorTarjetas.scrollLeft = 0;
            }
            actualizarAccesibilidadCarrusel(false);
        }

        function moverCarrusel(direccion) {
            const cantidadTarjetas = contenedorTarjetas.children.length;
            if (!cantidadTarjetas || !hayDesbordeTarjetas()) {
                return;
            }

            const cantidadVisible = obtenerCantidadTarjetasVisibles();
            const ultimoIndice = Math.max(0, cantidadTarjetas - cantidadVisible);
            if (direccion === -1) {
                indiceTarjetaActiva = Math.max(0, indiceTarjetaActiva - 1);
            } else {
                indiceTarjetaActiva = Math.min(ultimoIndice, indiceTarjetaActiva + 1);
            }
            actualizarAccesibilidadCarrusel(true);
            centrarTarjetaActiva(true);
        }

        flechaAnterior.addEventListener('click', () => moverCarrusel(-1));
        flechaSiguiente.addEventListener('click', () => moverCarrusel(1));

        let arrastrando = false;
        let posicionInicialPuntero = 0;
        let scrollInicial = 0;
        let temporizadorFinScroll = null;

        function iniciarArrastre(event) {
            if (event.pointerType === 'touch' || event.button !== 0 || !hayDesbordeTarjetas()) {
                return;
            }

            arrastrando = true;
            posicionInicialPuntero = event.clientX;
            scrollInicial = contenedorTarjetas.scrollLeft;
            contenedorTarjetas.setPointerCapture(event.pointerId);
            contenedorTarjetas.style.cursor = 'grabbing';
            contenedorTarjetas.style.scrollSnapType = 'none';
            contenedorTarjetas.style.userSelect = 'none';
        }

        function arrastrar(event) {
            if (!arrastrando) {
                return;
            }

            event.preventDefault();
            contenedorTarjetas.scrollLeft = scrollInicial - (event.clientX - posicionInicialPuntero);
        }

        function terminarArrastre(event) {
            if (!arrastrando) {
                return;
            }

            arrastrando = false;
            if (contenedorTarjetas.hasPointerCapture(event.pointerId)) {
                contenedorTarjetas.releasePointerCapture(event.pointerId);
            }
            contenedorTarjetas.style.cursor = 'grab';
            contenedorTarjetas.style.scrollSnapType = 'x mandatory';
            contenedorTarjetas.style.userSelect = '';
            actualizarIndiceTarjetaActiva();
            actualizarAccesibilidadCarrusel(true);
            centrarTarjetaActiva(true);
        }

        contenedorTarjetas.addEventListener('pointerdown', iniciarArrastre);
        contenedorTarjetas.addEventListener('pointermove', arrastrar);
        contenedorTarjetas.addEventListener('pointerup', terminarArrastre);
        contenedorTarjetas.addEventListener('pointercancel', terminarArrastre);
        contenedorTarjetas.addEventListener('dragstart', (event) => event.preventDefault());

        contenedorTarjetas.addEventListener('scroll', () => {
            clearTimeout(temporizadorFinScroll);
            temporizadorFinScroll = setTimeout(() => {
                if (!arrastrando && hayDesbordeTarjetas()) {
                    actualizarIndiceTarjetaActiva();
                    actualizarAccesibilidadCarrusel(true);
                    centrarTarjetaActiva(true);
                }
            }, 140);
        }, { passive: true });

        carruselTarjetas.appendChild(flechaAnterior);
        carruselTarjetas.appendChild(flechaSiguiente);
        carruselTarjetas.appendChild(contenedorTarjetas);
        carruselTarjetas.appendChild(estadoCarrusel);
        panelTarjetas.appendChild(carruselTarjetas);

        let marcaActiva = contenidoPagina.millas.marcaInicial;

        function renderizarTarjetas() {
            clearTimeout(temporizadorFinScroll);
            panelTarjetas.setAttribute('aria-busy', 'true');
            contenedorTarjetas.innerHTML = '';
            indiceTarjetaActiva = 0;
            ultimoMensajeAnunciado = '';
            contenedorTarjetas.scrollLeft = 0;
            const tarjetasFiltradas = contenidoPagina.millas.tarjetas.filter((tarjeta) =>
                tarjeta.marca === marcaActiva);
            tarjetasFiltradas.forEach((tarjeta, indice) => {
                const tarjetaEl = crearTarjetaMillas(tarjeta);
                tarjetaEl.setAttribute('role', 'group');
                tarjetaEl.setAttribute('aria-roledescription', 'tarjeta');
                tarjetaEl.setAttribute('aria-label', tarjeta.nombre + ', ' +
                    (indice + 1) + ' de ' + tarjetasFiltradas.length);
                const nombreVisible = tarjetaEl.querySelector('.bcp_tarjeta_millas_nombre');
                if (nombreVisible) {
                    nombreVisible.setAttribute('aria-hidden', 'true');
                }
                contenedorTarjetas.appendChild(tarjetaEl);
            });
            requestAnimationFrame(() => {
                actualizarFlechasCarrusel();
                panelTarjetas.setAttribute('aria-busy', 'false');
            });
        }

        function actualizarEstadoTabs() {
            Array.from(filaTabs.children).forEach((tab) => {
                const activa = tab.getAttribute('data-marca') === marcaActiva;
                tab.setAttribute('aria-selected', activa ? 'true' : 'false');
                tab.tabIndex = activa ? 0 : -1;
                tab.style.color = activa ? colorConoceMas : colorTabInactiva;
                tab.style.borderBottom = activa ?
                    '3px solid ' + colorConoceMas :
                    '2px solid ' + colorBordeTabInactiva;
                if (activa) {
                    panelTarjetas.setAttribute('aria-labelledby', tab.id);
                }
            });
        }

        function activarMarca(marca) {
            if (marcaActiva !== marca) {
                marcaActiva = marca;
                renderizarTarjetas();
            }
            actualizarEstadoTabs();
        }

        function renderizarTabs() {
            filaTabs.innerHTML = '';
            contenidoPagina.millas.pestanas.forEach((pestana, indice) => {
                const tab = document.createElement('button');
                tab.id = 'bcp-tab-millas-' + pestana.marca.toLowerCase();
                tab.className = 'bcp_tab_millas';
                tab.type = 'button';
                tab.setAttribute('role', 'tab');
                tab.setAttribute('aria-controls', idPanelMillas);
                tab.setAttribute('data-marca', pestana.marca);
                tab.appendChild(document.createTextNode(pestana.etiqueta + ' '));
                const conteo = document.createElement('span');
                conteo.className = 'bcp_conteo_tab_millas';
                conteo.textContent = '(' + contenidoPagina.millas.tarjetas.filter((tarjeta) =>
                    tarjeta.marca === pestana.marca).length + ')';
                tab.appendChild(conteo);
                tab.style.cursor = 'pointer';
                tab.style.padding = '0 16px 8px 16px';
                tab.style.fontFamily = 'Flexo-Demi';
                tab.style.fontSize = '16px';
                tab.style.lineHeight = '24px';
                tab.style.background = 'transparent';
                tab.style.borderTop = '0';
                tab.style.borderLeft = '0';
                tab.style.borderRight = '0';
                tab.style.whiteSpace = 'nowrap';

                tab.addEventListener('click', () => {
                    activarMarca(pestana.marca);
                });

                tab.addEventListener('keydown', (event) => {
                    let nuevoIndice = indice;
                    if (event.key === 'ArrowLeft') {
                        nuevoIndice = (indice - 1 + contenidoPagina.millas.pestanas.length) %
                            contenidoPagina.millas.pestanas.length;
                    } else if (event.key === 'ArrowRight') {
                        nuevoIndice = (indice + 1) % contenidoPagina.millas.pestanas.length;
                    } else if (event.key === 'Home') {
                        nuevoIndice = 0;
                    } else if (event.key === 'End') {
                        nuevoIndice = contenidoPagina.millas.pestanas.length - 1;
                    } else {
                        return;
                    }

                    event.preventDefault();
                    const nuevaPestana = contenidoPagina.millas.pestanas[nuevoIndice];
                    activarMarca(nuevaPestana.marca);
                    filaTabs.children[nuevoIndice].focus();
                });

                filaTabs.appendChild(tab);
            });
            actualizarEstadoTabs();
        }

        renderizarTabs();
        renderizarTarjetas();
        let frameActualizacionTamano = null;
        function programarActualizacionTamano() {
            if (frameActualizacionTamano !== null) {
                cancelAnimationFrame(frameActualizacionTamano);
            }
            frameActualizacionTamano = requestAnimationFrame(() => {
                frameActualizacionTamano = null;
                actualizarFlechasCarrusel();
            });
        }

        if ('ResizeObserver' in window) {
            const observerTamano = new ResizeObserver(programarActualizacionTamano);
            observerTamano.observe(contenedorTarjetas);
        } else {
            window.addEventListener('resize', programarActualizacionTamano);
        }

                enlace.setAttribute('rel', 'noopener noreferrer');
            });

            boton.addEventListener('click', () => {
                const abrir = boton.getAttribute('aria-expanded') !== 'true';
                boton.setAttribute('aria-expanded', abrir ? 'true' : 'false');
                respuesta.setAttribute('aria-hidden', abrir ? 'false' : 'true');
                envoltura.classList.toggle('activo', abrir);
                if (abrir) {
                    respuesta.removeAttribute('inert');
                    respuesta.style.maxHeight = respuesta.scrollHeight + 'px';
                } else {
                    respuesta.setAttribute('inert', '');
                    respuesta.style.maxHeight = '0px';
                }
            });

            if ('ResizeObserver' in window) {
                const observerRespuesta = new ResizeObserver(() => {
                    if (boton.getAttribute('aria-expanded') === 'true') {
                        respuesta.style.maxHeight = respuesta.scrollHeight + 'px';
                    }
                });
                observerRespuesta.observe(contenidoRespuesta);
            }

            envoltura.appendChild(boton);
            envoltura.appendChild(respuesta);
            componente.appendChild(envoltura);
            listado.appendChild(componente);
        });

        contenedorAcordeon.appendChild(listado);
        container.appendChild(contenedorAcordeon);
        presentacion.appendChild(container);
        seccion.appendChild(presentacion);

    // El formulario ya está en el HTML al parsear (no se inyecta por AJAX), pero por las dudas
    // de timing de inyección del propio piloto.html se reintenta hasta encontrarlo.
    function aplicarCambiosFormulario() {
        const formLatamPass = document.querySelector('#formulario-latam-pass');
        const botonEl = formLatamPass && formLatamPass.querySelector(BOTON_SELECTOR);
        const tipoDocumentoEl = formLatamPass && formLatamPass.querySelector(TIPO_DOC_SELECTOR);
        if (!formLatamPass || !botonEl || !tipoDocumentoEl) {
            return false;
        }

        const tituloEl = formLatamPass.querySelector('.bcp_titulo');
        if (tituloEl) {
            tituloEl.textContent = contenidoPagina.formulario.titulo;
        }
        botonEl.textContent = contenidoPagina.formulario.textoBoton;
        botonEl.classList.add('bcp_cta_registro');
        registrarVistaPromocion(botonEl, nombrePromocionHomePiloto,
            'Inscribirme Ahora - Inicio');

        const descripcionEl = formLatamPass.querySelector('.bcp_descripcion');
        if (descripcionEl && !formLatamPass.querySelector('.bcp_conoce_mas')) {
            descripcionEl.insertAdjacentElement('afterend', crearBloqueConoceMas());
        }

        const contenedorBoton = botonEl.closest('.bcp_content_boton') || botonEl;
        if (tipoDocumentoEl.nextElementSibling !== contenedorBoton) {
            tipoDocumentoEl.insertAdjacentElement('afterend', contenedorBoton);
        }
        botonEl.style.setProperty('width', '100%', 'important');

        let ancla = formLatamPass;
        if (!document.querySelector('.bcp_seccion_beneficios')) {
            const seccionBeneficios = crearSeccionBeneficios();
            formLatamPass.insertAdjacentElement('afterend', seccionBeneficios);
            ancla = seccionBeneficios;
        } else {
            ancla = document.querySelector('.bcp_seccion_beneficios');
        }

        let seccionMillas = document.querySelector('.bcp_seccion_millas');
        if (!seccionMillas) {
            seccionMillas = crearSeccionMillas();
            ancla.insertAdjacentElement('afterend', seccionMillas);
        }

        let seccionPreguntas = document.querySelector('.bcp_preguntas_frecuentes_latam_piloto');
        if (!seccionPreguntas) {
            seccionPreguntas = crearSeccionPreguntasFrecuentes();
            seccionMillas.insertAdjacentElement('afterend', seccionPreguntas);
        }

        let bannerSeguro = document.querySelector('.bcp_banner_seguro_tarjetas_latam_piloto');
        if (!bannerSeguro) {
            bannerSeguro = crearBannerSeguroTarjetas();
            seccionPreguntas.insertAdjacentElement('afterend', bannerSeguro);
        }

        if (!document.querySelector('.bcp_seccion_terminos')) {
            bannerSeguro.insertAdjacentElement('afterend', crearSeccionTerminosCondiciones());
        }

        return true;
    }

    if (!aplicarCambiosFormulario()) {
        const observerFormulario = new MutationObserver(() => {
            if (aplicarCambiosFormulario()) {
                observerFormulario.disconnect();
            }
        });
        observerFormulario.observe(document.body, { childList: true, subtree: true });
    }

    // No se hardcodea la URL de los módulos: el query string (CACHEID/V) es un cache-buster
    // que cambia con cada deploy del sitio. Si nuestro import() no resuelve a la MISMA url que
    // ya usó el <script type="module"> de la página, el navegador lo trata como un módulo
    // distinto y lo vuelve a evaluar, y customElements.define() explota la segunda vez
    // ("already been used"). Por eso se lee la url en vivo desde ese script.
    //
    // La resolución relativa-a-absoluta se hace con un <a> en vez de new URL(...) porque
    // esta página pisa el global URL: un tag de GTM hace var URL = google_tag_manager[...],
    // que sobreescribe el constructor nativo con un string.
    function resolverRutaAbsoluta(ruta) {
        const enlace = document.createElement('a');
        enlace.href = ruta;
        return enlace.href;
    }

    function resolverUrlModulo(nombreArchivo) {
        const patron = new RegExp('from\\s*["\']([^"\']*' + nombreArchivo.replace('.', '\\.') + '[^"\']*)["\']');
        for (const script of document.querySelectorAll('script[type="module"]')) {
            const match = script.textContent.match(patron);
            if (match) {
                return resolverRutaAbsoluta(match[1]);
            }
        }
        throw new Error('No se encontró el import de ' + nombreArchivo + ' en la página.');
    }

    let modulosCargados = null;
    function cargarModulos() {
        if (!modulosCargados) {
            modulosCargados = Promise.all([
                import(resolverUrlModulo('formulario-v2.js')),
                import(resolverUrlModulo('recaptcha.js'))
            ]);
        }
        return modulosCargados;
    }

    async function manejarEnvioFormulario(botonSuscribirse) {
        const formLatamPass = botonSuscribirse.closest('#formulario-latam-pass');
        const strTipoNroDocumento = formLatamPass.querySelector(TIPO_DOC_SELECTOR);

        const [
            { validarTipoNroDocumento, getTipoDocumento, getNroDocumento, actualizarEstadoBoton, sendApiForm },
            { renderRecaptcha }
        ] = await cargarModulos();

        if (!validarTipoNroDocumento(strTipoNroDocumento)) {
            return;
        }

        const dataFormulario = {
            tipodocumento: getTipoDocumento(strTipoNroDocumento),
            documento: getNroDocumento(strTipoNroDocumento),
            coordenadas: '0,0',
            intencionventa: intencionVenta
        };

        actualizarEstadoBoton(botonSuscribirse, true);

        renderRecaptcha(botonSuscribirse, (strTokenCaptcha) => {
            try {
                if (!dataFormulario.tipodocumento && !dataFormulario.documento) {
                    location.reload();
                    return;
                }

                const jsonRequest = {
                    leadId: getLeadID(),
                    producto: strNombreProducto,
                    tipoFormulario: 'SOLICITUDWEBLATAM',
                    tipoProducto: strNombreProducto,
                    captchaToken: strTokenCaptcha,
                    data: dataFormulario
                };

                // A diferencia de referencia.html, acá no se redirige a /campanas-latam al terminar.
                // En referencia.html ese reset nunca hace falta porque la redirección navega
                // fuera de la página; acá hay que hacerlo a mano o el botón queda girando.
                sendApiForm(jsonRequest, strTokenCaptcha, () => {
                    actualizarEstadoBoton(botonSuscribirse, false);
                    // actualizarEstadoBoton puede restaurar la etiqueta original del botón.
                    botonSuscribirse.textContent = contenidoPagina.formulario.textoBoton;
                    mostrarEstadoExitoFormulario(formLatamPass);
                    deshabilitarCtasRegistro();
                });
            } catch (error) {
                console.error(error);
            }
        });
    }

    // El listener original vive en el propio botón (dentro del <script type="module">
    // de referencia.html), así que hay que interceptar más arriba en fase de captura
    // para llegar antes: un capture:true en el mismo nodo no alcanza, ahí el orden
    // lo define el registro, no la fase.
    document.addEventListener('click', (event) => {
        const boton = event.target.closest(BOTON_SELECTOR);
        if (!boton) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        if (registroCompletado) {
            return;
        }

        manejarEnvioFormulario(boton).catch(console.error);
    }, true);

})();
